# Dependabot (15 Sep 2026): version updates for the three package sets and
# the Actions we run. Weekly, Monday morning IST, minor+patch grouped into one
# PR per set so the inbox is one PR a week, not fifteen; majors come alone.
# Rajat merges after CI (tests.yml) is green - nothing installs on the laptop.
# Security updates are separate and on by default for a public repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, web]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
