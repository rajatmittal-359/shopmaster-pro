# The weekly copy of the database (plan 2.37b, 15 Sep 2026; taken from the
# box since the 20 Sep cutover).
#
# WHY
#   Atlas M0 keeps no backups - that starts at M10. `backend/backupDb.js` is
#   the only copy of orders, payouts, sellers and reviews outside Atlas, and
#   "Rajat remembers to run it" is not a schedule. This runs it every night
#   and keeps the export for 90 days.
#
# WHY IT RUNS ON THE BOX, NOT ON THE RUNNER
#   The production cluster's Network Access list holds the Lightsail box and
#   the laptop, nothing else - on purpose. A GitHub runner has a different
#   address every time, so Atlas refuses it (the first try after cutover
#   timed out after 47 s). So the job SSHes into the box, runs the export
#   inside the api container - which already carries the production
#   MONGO_URI - streams the tarball back over the same connection, and only
#   then encrypts and uploads. No database secret lives in GitHub any more.
#
# WHY IT IS ENCRYPTED
#   This repository is public. An artifact on a public repository can be
#   downloaded by anyone with a GitHub account, and the export holds
#   addresses, phone numbers and password hashes. So the export is
#   AES-256 encrypted with a passphrase that lives only in the repository
#   secrets and Rajat's password manager. Without the secret the job skips
#   itself with a notice - it never uploads in the clear.
#
# SET-UP (the deploy workflow's LIGHTSAIL_HOST / LIGHTSAIL_SSH_KEY are reused)
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  BACKUP_PASSPHRASE
#     Value: a long random passphrase (e.g. 6+ words). Keep a copy in the
#            password manager: a backup nobody can open is not a backup.
#
# RESTORE (on the laptop)
#   1. Actions -> "weekly backup" -> the run -> download `db-backup-<date>`
#   2. unzip it; then, with the passphrase:
#        openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#          -in backup.tar.gz.enc -out backup.tar.gz -pass pass:'<passphrase>'
#        tar xzf backup.tar.gz
#   3. cd backend && node backupDb.js --restore ./backup --into shopmaster_restore_test
#      (it refuses the live database name without --force, on purpose)
#
# COST
#   Nothing: Actions minutes and artifact storage are free on public repos.
name: daily backup

on:
  schedule:
    # Daily 21:00 UTC = 02:30 IST (22 Sep 2026: weekly → daily. A commerce
    # site's recovery point is a day at most; the M0 cluster has no backups of
    # its own, so this export IS the backup). 90-day retention → ~90 artifacts
    # of a few hundred KB; still free on a public repository.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: skip until the secrets exist
        id: gate
        env:
          HAVE_HOST: ${{ secrets.LIGHTSAIL_HOST != '' && secrets.LIGHTSAIL_SSH_KEY != '' }}
          HAVE_PASS: ${{ secrets.BACKUP_PASSPHRASE != '' }}
        run: |
          if [ "$HAVE_HOST" != "true" ]; then
            echo "::error::LIGHTSAIL_HOST / LIGHTSAIL_SSH_KEY are not set - the backup runs on the box"
            exit 1
          fi
          if [ "$HAVE_PASS" != "true" ]; then
            echo "::warning::backup skipped - add BACKUP_PASSPHRASE as a repository secret (see the comment at the top of backup.yml). The repository is public, so an unencrypted export is never uploaded."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: export every collection on the box and bring the tarball back
        if: steps.gate.outputs.go == 'true'
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          install -m 600 /dev/null box.key && printf '%s\n' "$KEY" > box.key
          # The export's own log goes to stderr so stdout is the tarball alone.
          ssh -i box.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "ubuntu@$HOST" \
            'cd /srv/shopmaster && docker compose exec -T api sh -c "rm -rf /tmp/backup && node backupDb.js --out /tmp/backup 1>&2 && tar czf - -C /tmp backup"' \
            > backup.tar.gz
          rm -f box.key
          ls -l backup.tar.gz
          # A tarball with fewer than three files is a failure, not a backup.
          [ "$(tar tzf backup.tar.gz | grep -c '\.json$')" -ge 3 ]

      - name: encrypt
        if: steps.gate.outputs.go == 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.tar.gz -out backup.tar.gz.enc -pass env:PASS
          rm -f backup.tar.gz
          ls -l backup.tar.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in backup.tar.gz.enc -pass env:PASS | tar tzf - | head -3

      - name: stamp
        if: steps.gate.outputs.go == 'true'
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.go == 'true'
        with:
          name: db-backup-${{ steps.stamp.outputs.date }}
          path: backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
