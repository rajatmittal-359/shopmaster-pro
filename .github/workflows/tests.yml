# Every push and every pull request runs the tests.
#
# WHY THIS EXISTS
#   754 tests were written and none of them gated anything. They ran only when
#   somebody remembered to type `npm test`. Meanwhile Render deployed every push
#   to main straight to production - 69 of them in the last 30 days - so a broken
#   commit reached shopmasterpro.in and was found by a customer, if at all.
#
#   Auto-deploy on push is normal and professional. Auto-deploy on UNVERIFIED
#   push is not. This is the verification.
#
# COST
#   Nothing. GitHub does not meter Actions minutes on PUBLIC repositories using
#   standard runners, and this repo is public. (On a private repo the free
#   allowance would be 2,000 Linux minutes a month - about 600 runs of this.)
name: tests

on:
  push:
  pull_request:

# A second push to the same branch cancels the first run still in progress.
# Without this, pushing three times in a minute burns three full runs to learn
# about the last commit only.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `ci` and not `install`: it installs exactly what the lockfile says and
      # fails if package.json and the lockfile disagree. `install` would quietly
      # resolve new versions, so CI could pass on code that fails locally.
      - name: install
        working-directory: backend
        run: npm ci

      - name: test
        working-directory: backend
        # tests/setup.mjs points MONGO_URI at a host that is never connected -
        # no test may reach a real database. Set here too so a missing local
        # .env can never silently change what the tests talk to.
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/never-connected
        run: npm test

  frontend:
    name: frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      # The build is the real test here. A broken import or a mistyped component
      # name fails it, and both have reached production from this repo before -
      # twice, from a find-and-replace that silently matched nothing.
      - name: build
        working-directory: frontend
        run: npm run build

      # Plain `eslint src` would fail immediately: there are 30 long-standing
      # ERRORS, 24 of them the same react-hooks pattern, and --max-warnings
      # cannot excuse an error. Blocking every future commit behind fixing all
      # of them would end one way - the lint step being switched off.
      #
      # So the count is compared against a committed baseline instead. New
      # mistakes push it up and fail the build; fixing old ones pushes it down.
      # The debt can only shrink.
      - name: lint
        working-directory: frontend
        run: node scripts/lint-baseline.mjs

  # The app that replaces frontend/ at the October cutover (15 Sep 2026).
  # Until now only the OLD app was built here, so a broken import in web/
  # would have reached the cutover unseen. Lint is clean (0 problems on
  # 15 Sep) so it runs plain, no baseline. The build needs no secrets: every
  # NEXT_PUBLIC_* has a default and server pages fall back when the API is
  # unreachable.
  web:
    name: web build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: web
        run: npx eslint src
      - name: build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # Five smoke tests over the REAL stack (22 Sep 2026; web/e2e/smoke.spec.js):
  # a throwaway Mongo, the seed's three demo accounts and the house shop's
  # catalogue, the API on :5000 and the built web on :3000, then Playwright on
  # a 390 px phone. It is the only check that would notice a checkout that
  # renders but cannot add to cart. Needs the two web jobs' work done first,
  # so it waits for them; the deploy workflow waits for this whole workflow.
  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/shopmaster_e2e
      JWT_SECRET: e2e-only-not-a-secret-0123456789abcdef
      PORT: '5000'
      FRONTEND_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      USE_EXTERNAL_CRON: 'true'
      SEED_DEMO_PASSWORD: E2e-demo-pass-2026
      # The three owner accounts take their own keys (seed.js ACCOUNTS); the same value keeps the spec simple.
      SEED_ADMIN_PASSWORD: E2e-demo-pass-2026
      SEED_SELLER_PASSWORD: E2e-demo-pass-2026
      SEED_CUSTOMER_PASSWORD: E2e-demo-pass-2026
      SEED_ADMIN_EMAIL: admin@e2e.local
      SEED_SELLER_EMAIL: seller@e2e.local
      SEED_CUSTOMER_EMAIL: customer@e2e.local
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:5000/api
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: install
        run: |
          (cd backend && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund)
      - name: seed the throwaway database
        working-directory: backend
        run: node seed.js --minimal
      - name: start the API
        working-directory: backend
        # development, not production: cookies without Secure over http://localhost, and no NODE_ENV leaking into `next build` (which must not see "development").
        env:
          NODE_ENV: development
        run: |
          (node server.js > ../api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:5000/api/health || { echo "== api.log"; cat ../api.log; echo "::error::API did not answer - $(tail -c 600 ../api.log | tr -s '[:space:]' ' ')"; exit 1; }
      - name: build and start the web
        working-directory: web
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -60 || { echo "::error::next build failed - see the lines above"; exit 1; }
          # output: standalone (the production image runs this exact server) - `next start` refuses it.
          ls .next/standalone >/dev/null || { echo "::error::no .next/standalone after the build"; exit 1; }
          cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
          (PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > ../web.log 2>&1 &)
          ok=0
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then ok=1; break; fi
            sleep 2
          done
          echo "== web.log"; cat ../web.log || true
          # The tail also goes out as an annotation: the checks API shows those to anyone, the raw log only to admins.
          [ "$ok" = 1 ] || { echo "::error::the web did not answer on :3000 in 90 s - $(tail -c 600 ../web.log | tr -s '[:space:]' ' ')"; exit 1; }
      - name: playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: smoke tests
        working-directory: web
        env:
          CI: 'true'
        run: npx playwright test
      - name: logs on failure
        if: failure()
        run: |
          echo "== api.log"; tail -60 api.log || true
          echo "== web.log"; tail -60 web.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

# THE GATE LIVES IN RENDER, NOT HERE.
#
# There was a deploy job here that called Render's deploy hook after the tests
# passed. Then Render's own Auto-Deploy setting turned out to offer exactly
# this, natively:
#
#     On Commit  |  After CI Checks Pass  |  Off
#
# "After CI Checks Pass" is set on shopmaster-api, so Render waits for these
# checks by itself. Keeping the deploy job as well would have deployed twice
# on every push - once from Render watching the branch, once from this workflow
# - and two deploys racing each other is how a half-built version ends up live.
#
# One gate, in the place that owns deploys. RENDER_DEPLOY_HOOK_URL is now an
# unused secret; harmless, and worth keeping in case the setting is ever
# changed back.
