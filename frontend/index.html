  <!doctype html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Google Merchant Center / Search Console ownership.

      Stays here permanently: removing it un-verifies the site, which quietly
      drops the free product listings and the Search Console data with them.
      React 19 hoists per-page <meta> tags into <head>, but it only manages the
      ones a component renders - this one is not among them and is left alone.
    -->
    <meta name="google-site-verification" content="J-uVRT0qusW8POpKiYesTJrheyqgBFO6G7cF-9jEUjg" />

    <!--
      Defaults only. Each page sets its own <title>, description and canonical;
      React 19 hoists those into <head> and they override what is here.

      A hard-coded canonical used to live here pointing at the homepage. Because
      this is a single-page app, that same tag was served for EVERY route, which
      told search engines that every product page was a duplicate of the
      homepage. It is deliberately not set here any more.
    -->
    <title>ShopMaster Pro</title>
    <meta name="description" content="ShopMaster Pro is a modern multi-category e-commerce platform where sellers can manage products and customers can shop easily online." />
    <meta name="robots" content="index, follow" />
    <!-- GA4, 13 Sep 2026: the same property the Next app reports to, so the
         numbers run through the cutover without a gap. Enhanced measurement
         handles this SPA's route changes. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SK8WB9BKFG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SK8WB9BKFG', { anonymize_ip: true });
    </script>
  </head>

    <body>
      <div id="root"></div>

      <!-- Razorpay checkout script (global window.Razorpay available in app) -->
      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

      <!-- Vite main entry -->
      <script type="module" src="/src/main.jsx"></script>
    </body>
  </html>
